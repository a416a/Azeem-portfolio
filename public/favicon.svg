<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="#f5f5f5"/>
  
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a9a9a9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Head -->
  <circle cx="250" cy="180" r="85" fill="#f4a460"/>
  
  <!-- Hair -->
  <path d="M 165 180 Q 165 100 250 95 Q 335 100 335 180" fill="#1a1a2e"/>
  <path d="M 170 140 Q 180 110 250 105 Q 320 110 330 140" fill="#0f0f1e"/>
  
  <!-- Face -->
  <ellipse cx="250" cy="190" rx="75" ry="85" fill="#e8c4a0"/>
  
  <!-- Eyes -->
  <circle cx="225" cy="170" r="8" fill="#2c2c2c"/>
  <circle cx="275" cy="170" r="8" fill="#2c2c2c"/>
  <circle cx="227" cy="168" r="3" fill="#ffffff"/>
  <circle cx="277" cy="168" r="3" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M 210 155 Q 225 150 240 153" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 260 153 Q 275 150 290 155" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 250 170 L 250 210" stroke="#d4a574" stroke-width="2" fill="none"/>
  
  <!-- Mouth -->
  <path d="M 230 230 Q 250 245 270 230" stroke="#c97a7a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Facial hair/stubble -->
  <circle cx="220" cy="235" r="1.5" fill="#8b7355" opacity="0.6"/>
  <circle cx="235" cy="240" r="1.5" fill="#8b7355" opacity="0.6"/>
  <circle cx="265" cy="240" r="1.5" fill="#8b7355" opacity="0.6"/>
  <circle cx="280" cy="235" r="1.5" fill="#8b7355" opacity="0.6"/>
  
  <!-- Blazer/Shirt -->
  <path d="M 170 260 L 160 500 L 340 500 L 330 260 Q 250 270 170 260" fill="#a9a9a9"/>
  
  <!-- Blazer lapels -->
  <path d="M 250 265 L 220 320 L 180 500" fill="#999999" opacity="0.8"/>
  <path d="M 250 265 L 280 320 L 320 500" fill="#999999" opacity="0.8"/>
  
  <!-- Dark shirt -->
  <rect x="220" y="260" width="60" height="80" fill="#1a1a2e" rx="5"/>
  
  <!-- Pocket square -->
  <rect x="310" y="320" width="20" height="20" fill="#2c2c2c" transform="rotate(45 320 330)"/>
</svg>